[package]
name = "ai-writer-studio"
version = "0.1.4"
description = "AI Writer Studio — Story OS cho tieu thuyet dai ky"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde_json = "1"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
