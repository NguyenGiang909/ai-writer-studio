<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>AI Writer Studio</title>
<style>
  html,body{margin:0;height:100%;background:#0f1117;color:#c9d1d9;
    font-family:"Segoe UI",system-ui,sans-serif;display:flex;
    align-items:center;justify-content:center}
  .wrap{text-align:center}
  .dot{width:46px;height:46px;margin:0 auto 18px;border-radius:12px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    animation:pulse 1.4s ease-in-out infinite}
  h1{font-size:20px;font-weight:600;margin:0 0 8px;color:#e6edf3}
  p{font-size:13px;margin:0;color:#8b949e}
  @keyframes pulse{0%,100%{opacity:.55;transform:scale(.96)}
    50%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="dot"></div>
  <h1>AI Writer Studio</h1>
  <p>Đang khởi động backend & frontend…</p>
</div>
</body>
</html>
