services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: writer
      POSTGRES_USER: writer
      POSTGRES_PASSWORD: writer
    ports: ["5432:5432"]
    volumes: [writer_pg:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [db, redis]

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  writer_pg:
