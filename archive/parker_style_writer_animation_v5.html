<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Writer Pen Animation v5</title>
<style>
:root {
  --bg:#f4f1eb;
  --card:#ebe6dd;
  --paper:#fffdfa;
  --ink:#514a41;
  --rule:#e6ddd0;
  --muted:#8b8277;
  --accent:#c5ab73;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:radial-gradient(circle at top,#faf8f3 0%,var(--bg) 62%);
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
}
.wrap{display:grid;gap:18px;justify-items:center}
.card{
  width:430px;height:280px;border-radius:28px;
  background:linear-gradient(180deg,#f0ece4,var(--card));
  border:1px solid #ddd4c6;
  box-shadow:0 20px 48px rgba(0,0,0,.08), inset 0 1px 0 rgba(255,255,255,.8);
  display:grid;place-items:center;
}
.stage{position:relative;width:370px;height:210px}
.paper{
  position:absolute;inset:16px;
  background:linear-gradient(180deg,#fffefb,#fffaf3);
  border-radius:18px;overflow:hidden;
  box-shadow:0 10px 28px rgba(0,0,0,.09), inset 0 1px 0 rgba(255,255,255,.9);
}
.paper:before,.paper:after{
  content:"";position:absolute;left:28px;right:28px;height:1px;background:var(--rule);
}
.paper:before{top:72px}
.paper:after{top:112px}

/* line remains small and restrained */
.scribble{
  position:absolute;
  left:118px;
  top:82px;
  width:96px;
  height:15px;
  overflow:visible;
}
.scribble path{
  fill:none;
  stroke:var(--ink);
  stroke-width:1.35;
  stroke-linecap:round;
  stroke-linejoin:round;
  stroke-dasharray:132;
  stroke-dashoffset:132;
}
.working .scribble path{animation:write 2.05s ease-in-out infinite}
@keyframes write{
  0%{stroke-dashoffset:132;opacity:.15}
  10%{opacity:.9}
  78%{stroke-dashoffset:0;opacity:.9}
  100%{stroke-dashoffset:0;opacity:.28}
}

/* nib is still the anchor point; only the pen orientation changes */
.pen{
  position:absolute;
  width:58px;
  height:92px;
  left:104px;
  top:20px;
  transform-origin:50% 96%;
  filter:drop-shadow(0 6px 8px rgba(0,0,0,.14));
}

/* Writing: body leans to the right, like a person actually writing */
.working .pen{animation:penWrite 2.05s ease-in-out infinite}
@keyframes penWrite{
  0%   {transform:translate(0px,0px) rotate(136deg)}
  20%  {transform:translate(18px,-1px) rotate(137deg)}
  40%  {transform:translate(38px,1px) rotate(136deg)}
  60%  {transform:translate(58px,-1px) rotate(135deg)}
  80%  {transform:translate(78px,0px) rotate(134deg)}
  100% {transform:translate(0px,0px) rotate(136deg)}
}

/* Idle: same right-leaning writing posture, but lifted slightly off the line */
.idle .pen{
  left:182px;
  top:26px;
  transform:translate(0,8px) rotate(136deg);
  transition:left .45s ease, top .45s ease, transform .45s ease;
}

.status{
  position:absolute;
  left:34px;
  bottom:22px;
  font-size:12px;
  color:var(--muted);
}
.dot{
  display:inline-block;
  width:5px;height:5px;border-radius:50%;
  background:var(--accent);
  margin-right:6px;vertical-align:1px;
}
.working .dot{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.75)}}

.controls{display:flex;gap:10px}
button{
  appearance:none;
  border:1px solid #d2cabb;
  background:#fffdfa;
  color:#211e1a;
  border-radius:999px;
  padding:10px 15px;
  font:600 13px ui-sans-serif,system-ui;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}
button:hover{background:#fff}
.hint{
  font-size:12px;
  color:#776f65;
  max-width:520px;
  text-align:center;
  line-height:1.45;
}
code{
  background:#fffdfa;
  border:1px solid #e3dbcf;
  border-radius:6px;
  padding:2px 5px;
}

@media (prefers-reduced-motion:reduce){
  .working .pen,.working .scribble path,.working .dot{animation:none!important}
  .scribble path{stroke-dashoffset:0}
}
</style>
</head>
<body>
<main class="wrap">
  <div class="card">
    <div id="writerPenV5" class="stage working">
      <div class="paper">
        <svg class="scribble" viewBox="0 0 96 15" aria-hidden="true">
          <path d="M1 8
                   C6 4,10 4,14 8
                   C18 12,23 12,27 8
                   C31 4,36 4,40 8
                   C44 12,49 12,53 8
                   C57 4,62 4,66 8
                   C70 12,75 12,79 8
                   C83 4,88 4,95 8"/>
        </svg>

        <div class="status">
          <span class="dot"></span><span id="label">AI đang viết…</span>
        </div>
      </div>

      <div class="pen" aria-hidden="true">
        <div class="pen-img"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button onclick="writerPenV5.setWorking(true)">Đang viết</button>
    <button onclick="writerPenV5.setWorking(false)">Idle</button>
  </div>

  <div class="hint">
    v5: giữ nguyên việc <b>mũi ngòi chạm đầu nét</b>, nhưng đổi sang tư thế
    <b>thân bút nghiêng sang phải</b> như người cầm bút thật.
    API: <code>writerPenV5.setWorking(true)</code> /
    <code>writerPenV5.setWorking(false)</code>
  </div>
</main>

<script>
const root = document.getElementById('writerPenV5');
const label = document.getElementById('label');
window.writerPenV5 = {
  setWorking(on) {
    root.classList.toggle('working', !!on);
    root.classList.toggle('idle', !on);
    label.textContent = on ? 'AI đang viết…' : 'Sẵn sàng';
  }
};
</script>
</body>
</html>
